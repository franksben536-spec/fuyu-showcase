<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>作品展示页 · 秋冬造型图集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }

      /* ---------- 深色星空作品页：星空底、金色光晕、浅色字 ---------- */
      :root {
        color-scheme: dark;
        --bg: #05070f;
        --bg-2: #0a1128;
        --bg-3: #141b38;
        --surface: rgba(255, 255, 255, .045);
        --ink: #F2EFE6;
        --ink-soft: #CFC9BC;
        --ink-faint: #96907F;
        --line: rgba(255, 255, 255, .12);
        --line-strong: rgba(255, 255, 255, .24);
        --accent: #D4AF37;
        --gold: #D4AF37;
        --gold-soft: #E8C874;
        --gold-pale: #F5D67B;
        --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .45);
        --radius: 6px;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(120% 90% at 78% -10%, rgba(64, 84, 160, .38), transparent 55%),
          radial-gradient(90% 70% at 8% 108%, rgba(88, 60, 140, .28), transparent 60%),
          linear-gradient(180deg, #04060f 0%, #070d20 42%, #0b1230 78%, #070a18 100%);
        line-height: 1.7;
        letter-spacing: .01em;
        overflow-x: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }

      .wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px 88px; }

      /* ---------- 头部 ---------- */
      header.hero {
        display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
        align-items: center; padding: 56px 0 48px;
      }
      h1 {
        font-size: clamp(30px, 4vw, 44px); line-height: 1.2; font-weight: 500;
        letter-spacing: -.02em; margin: 0;
      }
      /* 首图轮播：5 张横图淡入淡出自动轮换，圆点可点切 */
      .hero-photo { position: relative; margin: 0; aspect-ratio: 16 / 10; }
      .hero-slide {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center;
        border-radius: var(--radius); display: block;
        border: 1px solid rgba(212, 175, 55, .35);
        box-shadow: 0 0 32px rgba(212, 175, 55, .18), 0 24px 48px rgba(0, 0, 0, .5);
        opacity: 0; transition: opacity 1s ease; pointer-events: none;
      }
      .hero-slide.is-active { opacity: 1; pointer-events: auto; }
      .hero-dots {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 8px; z-index: 2; margin: 0;
      }
      .hero-dot {
        width: 8px; height: 8px; border-radius: 50%; border: 0; padding: 0;
        background: rgba(255, 255, 255, .45); cursor: pointer;
      }
      .hero-dot.is-active { background: #F5D67B; }
      @media (prefers-reduced-motion: reduce) {
        .hero-slide { transition: none; }
      }

      /* ---------- 筛选：简洁文字标签 ---------- */
      .filters {
        position: sticky; top: 0; z-index: 20;
        display: flex; gap: 4px 26px; flex-wrap: wrap;
        padding: 16px 0 14px;
        background: rgba(5, 7, 15, .92);
        border-bottom: 1px solid var(--line);
      }
      .chip {
        min-height: 36px; padding: 6px 2px; border: 0; background: none;
        color: var(--ink-faint); font: inherit; font-size: 14px; font-weight: 500;
        cursor: pointer; box-shadow: inset 0 -2px 0 transparent;
      }
      .chip:hover { color: var(--ink-soft); }
      .chip[aria-pressed="true"] {
        color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--ink);
      }

      /* ---------- 图集 ---------- */
      section.block { margin-top: 88px; }
      .block-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 28px; }
      h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; }

      .group { margin-top: 56px; }
      .group:first-of-type { margin-top: 4px; }
      .group-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 24px; }
      .group-title { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
      .group.is-hidden { display: none; }

      .sub-block { margin-top: 40px; }
      .block-head.sub { margin: 0 0 20px; }
      .sub-block h3 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
      .sub-block.is-hidden { display: none; }

      /* 作品卡片：图在上、文字在下，落在页面底色上，无卡片底、无阴影 */
      .grid {
        display: grid; gap: 56px 28px;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .card { margin: 0; background: none; border: 0; }
      .card button.thumb {
        display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in;
        border-radius: var(--radius); overflow: hidden;
      }
      .card img {
        width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top;
        display: block; transition: transform .45s ease;
      }
      .card button.thumb:hover img { transform: scale(1.02); }
      .card figcaption { padding: 12px 2px 0; }
      .card .t { font-weight: 600; font-size: 14px; line-height: 1.5; letter-spacing: -.005em; }
      .card .m { font-size: 12px; color: var(--ink-faint); margin-top: 3px; line-height: 1.6; }
      .card.is-hidden { display: none; }
      .empty-note { display: none; color: var(--ink-faint); padding: 18px 0; }
      .empty-note.show { display: block; }

      .grid.derived { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

      /* ---------- 作品网格：一个作品一张封面卡 ---------- */
      .works-grid {
        display: grid; gap: 56px 28px;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .work-card { margin: 0; background: none; border: 0; }
      .work-card button.thumb {
        display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
        border-radius: var(--radius); overflow: hidden;
      }
      .work-card img {
        width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
        display: block; transition: transform .45s ease;
      }
      .work-card button.thumb:hover img { transform: scale(1.02); }
      .work-card figcaption { padding: 12px 2px 0; }
      .work-card .t { font-weight: 600; font-size: 14px; line-height: 1.5; }
      .work-card .m { font-size: 12px; color: var(--ink-faint); margin-top: 3px; letter-spacing: .04em; }

      /* ---------- 作品完整页（全屏、浅色） ---------- */
      .work-viewer {
        position: fixed; inset: 0; z-index: 70; display: none;
        background: var(--bg); flex-direction: column;
      }
      .work-viewer.open { display: flex; }
      .wv-top {
        display: flex; align-items: baseline; gap: 16px;
        padding: 20px 28px 0; max-width: 1280px; width: 100%; margin: 0 auto;
      }
      .wv-top .t { font-weight: 700; font-size: 17px; letter-spacing: -.01em; flex: 1; min-width: 0; }
      .wv-close {
        flex: none; width: 40px; height: 40px; border-radius: 50%;
        border: 1px solid var(--line-strong); background: none;
        color: var(--ink-soft); font-size: 17px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
      }
      .wv-main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px 28px; }
      .wv-main img {
        max-width: min(1120px, 100%); max-height: 100%; object-fit: contain;
        border-radius: var(--radius); border: 1px solid var(--line); background: #fff;
        box-shadow: 0 24px 64px rgba(23, 21, 15, .14); display: block;
      }
      .wv-bottom { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 28px 26px; }
      .wv-btn {
        min-width: 52px; min-height: 44px; padding: 8px 20px; border-radius: 999px;
        border: 1px solid var(--line-strong); background: var(--surface);
        color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      .wv-btn:active { transform: scale(.97); }
      .wv-count { font-size: 14px; color: var(--ink-faint); min-width: 76px; text-align: center; letter-spacing: .04em; }

      footer {
        margin-top: 100px; padding-top: 24px; border-top: 1px solid var(--line);
        font-size: 12px; color: var(--ink-faint);
      }

      /* ---------- 灯箱 ---------- */
      .lightbox {
        position: fixed; inset: 0; z-index: 60; display: none;
        background: rgba(18, 18, 18, .96);
        align-items: center; justify-content: center; flex-direction: column;
        padding: 18px;
      }
      .lightbox.open { display: flex; }
      .lightbox figure { margin: 0; max-width: min(92vw, 560px); text-align: center; }
      .lightbox img {
        max-width: 100%; max-height: 76vh; object-fit: contain;
        border-radius: 6px; box-shadow: 0 24px 60px rgba(0,0,0,.5);
      }
      .lightbox figcaption { color: #F5F2EC; margin-top: 16px; font-size: 15px; }
      .lightbox figcaption .sub { color: #A9A49B; font-size: 13px; display: block; margin-top: 3px; }
      .lb-btn {
        position: absolute; width: 46px; height: 46px; border-radius: 50%;
        border: 1px solid rgba(245, 242, 236, .3); background: rgba(255, 255, 255, .06);
        color: #F5F2EC; font-size: 19px; cursor: pointer; line-height: 1;
        display: flex; align-items: center; justify-content: center;
      }
      .lb-close { top: 16px; right: 16px; }
      .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
      .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
      .lb-btn:active { transform: scale(.95); }
      .lb-prev:active, .lb-next:active { transform: translateY(-50%) scale(.95); }

      @media (max-width: 760px) {
        .wrap { padding: 0 18px 72px; }
        header.hero { grid-template-columns: 1fr; gap: 28px; padding-top: 44px; }
        .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 14px; }
        .grid.derived { grid-template-columns: 1fr; }
        .works-grid { grid-template-columns: 1fr; gap: 24px; }
        .card figcaption, .work-card figcaption { padding-top: 10px; }
        .card .t { font-size: 14px; }
        .lb-prev { left: 6px; } .lb-next { right: 6px; }
        .wv-top { padding: 16px 16px 0; }
        .wv-main { padding: 14px 16px; }
        .wv-bottom { padding-bottom: 20px; }
      }
      /* ---------- 星空 ---------- */
      .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
      .sky canvas { position: absolute; inset: 0; display: block; }
      .milkyway {
        position: absolute; inset: -25%;
        background: linear-gradient(115deg, transparent 18%, rgba(148, 168, 255, .04) 38%, rgba(196, 208, 255, .08) 50%, rgba(148, 168, 255, .04) 62%, transparent 82%);
        filter: blur(24px);
        opacity: .6;
      }
      .wrap { position: relative; z-index: 1; }

      /* ---------- 3D 封面流 ---------- */
      .coverflow { position: relative; margin-top: 8px; outline: none; overflow: hidden; }
      .coverflow.is-hidden { display: none; }
      .cf-stage {
        position: relative; height: 560px;
        perspective: 1400px; perspective-origin: 50% 42%;
        touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none;
      }
      .cf-stage.is-dragging { cursor: grabbing; }
      .cf-stage.is-dragging .cf-item { transition: none !important; }
      .cf-item {
        position: absolute; left: 50%; top: 46%;
        width: 300px; margin: 0;
        transform-style: preserve-3d;
        transition: transform .55s cubic-bezier(.22, .9, .28, 1), opacity .55s ease, filter .55s ease;
      }
      .cf-item .cf-img-wrap {
        position: relative; border-radius: var(--radius); overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .1);
        background: #0d1322;
        box-shadow: 0 18px 44px rgba(0, 0, 0, .55);
      }
      .cf--portrait .cf-img-wrap { aspect-ratio: 3 / 4; }
      .cf--landscape .cf-item { width: 440px; }
      .cf--landscape .cf-img-wrap { aspect-ratio: 4 / 3; }
      .cf-item img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
      .cf--landscape .cf-item img { object-fit: contain; }
      .cf-halo {
        position: absolute; inset: -22%;
        background: radial-gradient(ellipse at center, rgba(245, 214, 123, .5) 0%, rgba(212, 175, 55, .28) 42%, rgba(212, 175, 55, .08) 62%, transparent 72%);
        filter: blur(22px);
        opacity: 0; transition: opacity .6s ease;
        pointer-events: none; z-index: -1;
      }
      .cf-item.is-center .cf-halo { opacity: 1; animation: halo-breathe 4.5s ease-in-out infinite alternate; }
      @keyframes halo-breathe { from { opacity: .75; } to { opacity: 1; } }
      .cf-item.is-center .cf-img-wrap {
        border-color: rgba(232, 200, 116, .65);
        box-shadow: 0 0 26px rgba(232, 200, 116, .42), 0 0 110px rgba(212, 175, 55, .3), 0 30px 70px rgba(0, 0, 0, .6);
      }
      .cf-caption { text-align: center; padding: 22px 16px 0; min-height: 86px; }
      .cf-title { font-weight: 600; font-size: 15px; letter-spacing: -.005em; color: var(--ink); }
      .cf-meta { font-size: 12px; color: var(--ink-faint); margin-top: 4px; letter-spacing: .06em; }
      .cf-count { font-size: 12px; color: var(--ink-faint); margin-top: 6px; letter-spacing: .18em; }
      .cf-btn {
        position: absolute; top: 46%; transform: translateY(-50%);
        width: 46px; height: 46px; border-radius: 50%;
        border: 1px solid rgba(232, 200, 116, .4); background: rgba(5, 7, 15, .55);
        color: var(--gold-soft); font-size: 22px; line-height: 1; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(6px); z-index: 200;
      }
      .cf-btn:hover { background: rgba(212, 175, 55, .18); }
      .cf-btn:active { transform: translateY(-50%) scale(.94); }
      .cf-prev { left: 6px; }
      .cf-next { right: 6px; }
      .coverflow:focus-visible { outline: 1px solid rgba(232, 200, 116, .5); outline-offset: 6px; border-radius: 8px; }

      @media (max-width: 760px) {
        .cf-stage { height: 420px; perspective: 1000px; }
        .cf-item { width: min(62vw, 250px); top: 44%; }
        .cf--landscape .cf-item { width: min(80vw, 330px); }
        .cf-btn { width: 40px; height: 40px; font-size: 19px; }
        .cf-prev { left: 0; } .cf-next { right: 0; }
        .cf-caption { min-height: 80px; padding-top: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cf-item { transition: none; }
        .cf-item.is-center .cf-halo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="sky" aria-hidden="true"><canvas id="skyCanvas"></canvas><div class="milkyway"></div></div>
    <div class="wrap">
      <header class="hero">
        <div>
          <h1>秋冬衣橱<br />造型图集</h1>
        </div>
        <figure class="hero-photo" id="heroSlideshow">
          <img class="hero-slide is-active" src="images/hero-01.jpg" alt="模特穿棕色麂皮夹克与白色马裤站在马场木栏旁，身旁是一匹棕色马，远处是城堡" />
          <img class="hero-slide" src="images/hero-02.jpg" alt="模特穿棕色皮夹克与白色围巾、白色长裤站在马场木栏旁，身旁是一匹棕色马，远处是群山" />
          <img class="hero-slide" src="images/hero-03.jpg" alt="一对男女模特坐在林间草地的野餐毯上，女方穿黄色针织衫，男方穿藏青衬衫，旁边是野餐篮" />
          <img class="hero-slide" src="images/hero-04.jpg" alt="两位女模特站在海边公路旁的白色敞篷车边，穿条纹 Polo 衫，身后是大海" />
          <img class="hero-slide" src="images/hero-05.jpg" alt="模特穿芥黄衬衫与白色阔腿裤坐在佛罗伦萨的石砌露台上，身后是圣母百花大教堂" />
          <div class="hero-dots" role="tablist" aria-label="首图切换">
            <button class="hero-dot is-active" type="button" aria-label="第 1 张"></button>
            <button class="hero-dot" type="button" aria-label="第 2 张"></button>
            <button class="hero-dot" type="button" aria-label="第 3 张"></button>
            <button class="hero-dot" type="button" aria-label="第 4 张"></button>
            <button class="hero-dot" type="button" aria-label="第 5 张"></button>
          </div>
        </figure>
      </header>

      <section class="block" aria-label="形象大片">
        <div class="block-head"><h2>形象大片</h2></div>
        <div class="coverflow cf--portrait" id="heroFlow" tabindex="0" role="region" aria-label="形象大片封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一张">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一张">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="朋友圈推广">
        <div class="block-head"><h2>朋友圈推广</h2></div>
        <div class="coverflow cf--portrait" id="momentsFlow" tabindex="0" role="region" aria-label="朋友圈推广封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一张">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一张">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="Lookbook">
        <div class="block-head"><h2>Lookbook</h2></div>
        <div class="coverflow cf--portrait" id="lookbookFlow" tabindex="0" role="region" aria-label="Lookbook 封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一张">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一张">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="作品">
        <div class="block-head"><h2>作品</h2></div>
        <div class="coverflow cf--landscape" id="ploFlow" tabindex="0" role="region" aria-label="PLO·CART 2026AW 秋季陈列指引封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一页">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一页">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="形象搭配 LOOK">
        <div class="block-head"><h2>形象搭配 LOOK</h2></div>
        <div class="coverflow cf--landscape" id="lookFlow" tabindex="0" role="region" aria-label="PLO·CART 2026AW 形象搭配 LOOK 封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一页">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一页">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="25-AW 陈列指引 · 第一波">
        <div class="block-head"><h2>25-AW 陈列指引 · 第一波</h2></div>
        <div class="coverflow cf--landscape" id="aw25aFlow" tabindex="0" role="region" aria-label="PLO·CART 25-AW 秋季陈列指引（第一波）封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一页">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一页">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      <section class="block" aria-label="25-AW 陈列指引 · 秋二波+冬一波">
        <div class="block-head"><h2>25-AW 陈列指引 · 秋二波+冬一波</h2></div>
        <div class="coverflow cf--landscape" id="aw25bFlow" tabindex="0" role="region" aria-label="PLO·CART 25-AW 秋冬陈列指引（秋二波+冬一波）封面流">
          <div class="cf-stage">
            <button class="cf-btn cf-prev" type="button" aria-label="上一页">‹</button>
            <button class="cf-btn cf-next" type="button" aria-label="下一页">›</button>
          </div>
          <div class="cf-caption"><div class="cf-title"></div><div class="cf-meta"></div><div class="cf-count"></div></div>
        </div>
      </section>

      /* ---------- 3D 封面流（Cover Flow） ---------- */
      function createCoverFlow(root, options) {
        var stage = root.querySelector('.cf-stage');
        var titleEl = root.querySelector('.cf-title');
        var metaEl = root.querySelector('.cf-meta');
        var countEl = root.querySelector('.cf-count');
        var prevBtn = root.querySelector('.cf-prev');
        var nextBtn = root.querySelector('.cf-next');
        var items = options.items.slice();
        var center = 0, centerF = 0, lastCap = -1;
        var cards = [];
        var downX = 0, downCenter = 0, moved = 0, activePointer = null, isDown = false;

        function build() {
          Array.prototype.slice.call(stage.querySelectorAll('.cf-item')).forEach(function (el) { el.remove(); });
          cards = items.map(function (item, i) {
            var fig = document.createElement('figure');
            fig.className = 'cf-item';
            fig.setAttribute('role', 'button');
            fig.setAttribute('aria-label', item.t);
            var halo = document.createElement('div');
            halo.className = 'cf-halo';
            fig.appendChild(halo);
            var wrap = document.createElement('div');
            wrap.className = 'cf-img-wrap';
            var img = document.createElement('img');
            img.alt = item.alt || item.t; img.decoding = 'async'; img.draggable = false;
            img.dataset.src = item.src;
            fig._img = img;
            wrap.appendChild(img);
            fig.appendChild(wrap);
            stage.appendChild(fig);
            return fig;
          });
          center = items.length ? 0 : -1;
          centerF = center;
          lastCap = -1;
          measureStep();
          layout();
          updateCaption(true);
        }

        /* 卡片间距只在创建/窗口变化时量一次：pointermove 里反复读 offsetWidth 会强制重排，是手机上翻图卡死的主因之一。 */
        var stepVal = 180;
        function measureStep() {
          var cw = cards.length ? cards[0].offsetWidth : 280;
          var land = root.classList.contains('cf--landscape');
          stepVal = Math.max(120, Math.min(cw * (land ? 0.68 : 0.62), stage.clientWidth * 0.44));
        }

        /* 只加载焦点附近的图片：3D 变换下浏览器会把所有图都当可见、74 张全解码会把手机内置浏览器撑爆。
           焦点 ±2 张内加载，超出 ±5 张的卸掉 src 释放内存。窗口收得小，翻多了也不会越积越卡。 */
        function ensureSrcs() {
          var c = Math.round(centerF);
          cards.forEach(function (card, i) {
            var img = card._img;
            if (!img) return;
            if (Math.abs(i - c) <= 2) {
              if (!img.getAttribute('src')) img.src = img.dataset.src;
            } else if (Math.abs(i - c) > 5) {
              if (img.getAttribute('src')) img.removeAttribute('src');
            }
          });
        }

        function layout() {
          if (!cards.length) return;
          var s = stepVal;
          cards.forEach(function (card, i) {
            var d = i - centerF;
            var ad = Math.abs(d);
            var x = d * s;
            var z = -Math.min(ad, 4) * 130;
            var rot = Math.max(-62, Math.min(62, d * -46));
            var sc = Math.max(0.55, Math.pow(0.86, ad));
            var op = ad > 3.5 ? 0 : Math.max(0.12, 1 - ad * 0.24);
            card.style.transform = 'translate(-50%,-50%) translateX(' + x.toFixed(1) + 'px) translateZ(' + z.toFixed(0) + 'px) rotateY(' + rot.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
            card.style.opacity = op.toFixed(2);
            card.style.zIndex = String(100 - Math.round(ad * 10));
            /* 远处的卡片直接 display:none：连盒子都不生成，既不撑宽页面也不占合成层；切回来时在边缘几乎透明，看不出闪现。 */
            card.style.display = ad > 3.5 ? 'none' : '';
            card.style.pointerEvents = ad > 3.5 ? 'none' : '';
            card.classList.toggle('is-center', Math.round(centerF) === i && Math.abs(d) < 0.5);
          });
          ensureSrcs();
        }

        /* 拖动时用 rAF 把多次 layout 合并成一次：pointermove 高频触发时直接读写样式会反复强制重排，手机上会卡死。 */
        var layoutQueued = false;
        function queueLayout() {
          if (layoutQueued) return;
          layoutQueued = true;
          requestAnimationFrame(function () {
            layoutQueued = false;
            layout();
            updateCaption(false);
          });
        }

        function updateCaption(force) {
          var idx = Math.round(centerF);
          if (!items.length || (idx === lastCap && !force)) return;
          lastCap = idx;
          var cap = options.caption(items[idx], idx, items.length);
          titleEl.textContent = cap.title;
          metaEl.textContent = cap.meta;
          countEl.textContent = (idx + 1) + ' / ' + items.length;
        }

        function goTo(i) {
          if (!items.length) return;
          center = Math.max(0, Math.min(items.length - 1, i));
          centerF = center;
          /* 翻页期间让星空暂停重画，把主线程让给翻图动画。 */
          window.__cfBusyUntil = Date.now() + 700;
          layout();
          updateCaption(true);
        }
        function stepBy(d) { goTo(center + d); }

        prevBtn.addEventListener('click', function () { stepBy(-1); });
        nextBtn.addEventListener('click', function () { stepBy(1); });

        root.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(-1); }
          if (e.key === 'ArrowRight') { e.preventDefault(); stepBy(1); }
        });

        /* 拖动改走 window 级监听，不用 setPointerCapture：pointer capture 会把后续 click 重定向到舞台，
           导致点侧边图、点箭头都收不到目标，箭头看起来能点实际没反应。 */
        function onMove(e) {
          if (!isDown || e.pointerId !== activePointer) return;
          var dx = e.clientX - downX;
          moved = Math.max(moved, Math.abs(dx));
          centerF = downCenter - dx / stepVal;
          centerF = Math.max(-0.3, Math.min(items.length - 1 + 0.3, centerF));
          window.__cfBusyUntil = Date.now() + 700;
          queueLayout();
        }
        var suppressClickUntil = 0;
        function endDrag() {
          if (!isDown) return;
          isDown = false;
          stage.classList.remove('is-dragging');
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', endDrag);
          window.removeEventListener('pointercancel', endDrag);
          if (moved > 8) suppressClickUntil = Date.now() + 300;
          goTo(Math.round(centerF));
        }
        stage.addEventListener('pointerdown', function (e) {
          isDown = true; activePointer = e.pointerId; downX = e.clientX; downCenter = centerF; moved = 0;
          window.__cfBusyUntil = Date.now() + 700;
          stage.classList.add('is-dragging');
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', endDrag);
          window.addEventListener('pointercancel', endDrag);
        });

        stage.addEventListener('click', function (e) {
          if (Date.now() < suppressClickUntil) return;
          var fig = e.target.closest('.cf-item');
          if (!fig) return;
          var idx = cards.indexOf(fig);

        { cover: "images/plo-25aw2-01.jpg", title: "PLO·CART 25-AW · 秋冬陈列指引（秋二波+冬一波）", meta: "24 页", pages: AW25B },
        { cover: "images/plo-26ss-01.jpg", title: "PLO·CART 2026SS · 夏季（补充）陈列指引", meta: "22 页", pages: SS26 },
        { cover: "images/plo-26aw1-01.jpg", title: "PLO·CART 2026AW · 秋季陈列指引（秋一波）", meta: "33 页", pages: AW26A }
      ];
      /* 作品（PLO·CART 2026AW）改用封面流呈现：36 页直接在封面流里翻看，点中间的图放大。
         WORKS 数组保留：加新作品时往 WORKS 里加一条（封面、标题、说明、页面数组）即可。 */
      var ploFlow = createCoverFlow(document.getElementById('ploFlow'), {
        items: WORKS[0].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 2026AW · 秋季陈列指引' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      /* 形象搭配 LOOK：与陈列指引同款横版封面流，24 页直接在封面流里翻看，点中间的图放大。 */
      var lookFlow = createCoverFlow(document.getElementById('lookFlow'), {
        items: WORKS[1].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 2026AW · 形象搭配 LOOK' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      /* 25-AW 第一波 / 秋二波+冬一波 / 2026SS 夏季补充：同款横版封面流。 */
      var aw25aFlow = createCoverFlow(document.getElementById('aw25aFlow'), {
        items: WORKS[2].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 25-AW · 秋季陈列指引（第一波）' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      var aw25bFlow = createCoverFlow(document.getElementById('aw25bFlow'), {
        items: WORKS[3].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 25-AW · 秋冬陈列指引（秋二波+冬一波）' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      var ss26Flow = createCoverFlow(document.getElementById('ss26Flow'), {
        items: WORKS[4].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 2026SS · 夏季（补充）陈列指引' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      /* 2026AW 秋一波：同款横版封面流。 */
      var aw26aFlow = createCoverFlow(document.getElementById('aw26aFlow'), {
        items: WORKS[5].pages,
        caption: function (item) { return { title: item.t, meta: 'PLO·CART 2026AW · 秋季陈列指引（秋一波）' }; },
        onCenterClick: function (list, idx) { openLightbox(list, idx); }
      });

      /* 首图轮播：5 张横图每 5 秒淡入淡出切换，点圆点可手动切；切页隐藏时暂停，减动效时不自动播。 */
      (function () {
        var box = document.getElementById('heroSlideshow');
        if (!box) return;
        var slides = box.querySelectorAll('.hero-slide');
        var dots = box.querySelectorAll('.hero-dot');
        if (!slides.length) return;
        var idx = 0, timer = null;
        var reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
        function show(n) {
          idx = (n + slides.length) % slides.length;
          for (var i = 0; i < slides.length; i++) {
            slides[i].classList.toggle('is-active', i === idx);
            if (dots[i]) dots[i].classList.toggle('is-active', i === idx);
          }
        }
        function start() {
          if (reduced || timer) return;
          timer = setInterval(function () { show(idx + 1); }, 5000);
        }
        function stop() { if (timer) { clearInterval(timer); timer = null; } }
        for (var d = 0; d < dots.length; d++) {
          (function (k) {
            dots[k].addEventListener('click', function () { stop(); show(k); start(); });
          })(d);
        }
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) stop(); else start();
        });
        start();
      })();

      /* ---------- 深色星空背景：旋涡星系 + 星云 + 星星 ---------- */
      (function () {
        var canvas = document.getElementById('skyCanvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var stars = [], W = 0, H = 0, galaxy = null;
        var reduced = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
        function rnd(a, b) { return a + Math.random() * (b - a); }

        /* 星系只画一次存到离屏画布：每帧只贴一张图 + 少量闪烁星，不会跟翻图抢主线程。 */
        function buildGalaxy() {
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          galaxy = document.createElement('canvas');
          galaxy.width = Math.round(W * dpr); galaxy.height = Math.round(H * dpr);
          var g = galaxy.getContext('2d');
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          var R = Math.min(W, H);
          /* 1) 星云：两团很大很淡的雾，互相重叠铺满整片天，不再分块 */
          var clouds = [
            { x: W * 0.42, y: H * 0.28, r: R * 0.95, c: '124,86,214' },
            { x: W * 0.62, y: H * 0.72, r: R * 0.95, c: '58,110,220' },
            { x: W * 0.85, y: H * 0.30, r: R * 0.70, c: '214,86,160' }
          ];
          clouds.forEach(function (n) {
            var grad = g.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
            grad.addColorStop(0, 'rgba(' + n.c + ',0.13)');
            grad.addColorStop(0.5, 'rgba(' + n.c + ',0.05)');
            grad.addColorStop(1, 'rgba(' + n.c + ',0)');
            g.fillStyle = grad;
            g.fillRect(n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
          });
          /* 2) 旋涡星系：3 条旋臂 + 亮核，放大后居中偏上，是整片天的主体 */
          var cx = W * 0.50, cy = H * 0.34;
          var coreR = R * 0.22;
          var core = g.createRadialGradient(cx, cy, 0, cx, cy, coreR);
          core.addColorStop(0, 'rgba(255,238,196,0.9)');
          core.addColorStop(0.35, 'rgba(255,208,150,0.32)');
          core.addColorStop(1, 'rgba(255,208,150,0)');
          g.fillStyle = core;
          g.fillRect(cx - coreR, cy - coreR, coreR * 2, coreR * 2);
          var armColors = ['255,255,255', '188,208,255', '255,220,170', '255,190,212'];
          var maxR = R * 0.62;
          var nArm = Math.round((W * H) / 1200);
          for (var i = 0; i < nArm; i++) {
            var arm = i % 3;
            var t = Math.random();
            var r = Math.pow(t, 0.65) * maxR;
            var spread = (1 - t) * 0.85 + 0.12;
            var ang = arm * (Math.PI * 2 / 3) + t * 4.4 + (Math.random() - 0.5) * spread;
            var x = cx + Math.cos(ang) * r;
            var y = cy + Math.sin(ang) * r * 0.60;
            var a = (1 - t) * 0.85 + 0.15;
            var c = armColors[(Math.random() * armColors.length) | 0];
            g.fillStyle = 'rgba(' + c + ',' + a.toFixed(2) + ')';
            g.beginPath(); g.arc(x, y, rnd(0.4, 1.7), 0, Math.PI * 2); g.fill();
          }
          /* 3) 几颗带光晕的亮星 */
          for (var b = 0; b < 6; b++) {
            var bx = rnd(W * 0.08, W * 0.92), by = rnd(H * 0.06, H * 0.94);
            var br = rnd(14, 26);
            var bg = g.createRadialGradient(bx, by, 0, bx, by, br);
            bg.addColorStop(0, 'rgba(255,255,255,0.85)');
            bg.addColorStop(0.25, 'rgba(210,225,255,0.28)');
            bg.addColorStop(1, 'rgba(210,225,255,0)');
            g.fillStyle = bg;
            g.beginPath(); g.arc(bx, by, br, 0, Math.PI * 2); g.fill();
            g.fillStyle = 'rgba(255,255,255,0.95)';
            g.beginPath(); g.arc(bx, by, rnd(1.1, 1.8), 0, Math.PI * 2); g.fill();
          }
          /* 4) 满天底星 + 银河带（斜向密星带） */
          var nField = Math.round((W * H) / 9000);
          for (var f = 0; f < nField; f++) {
            g.fillStyle = 'rgba(255,255,255,' + rnd(0.25, 0.9).toFixed(2) + ')';
            g.beginPath(); g.arc(Math.random() * W, Math.random() * H, rnd(0.4, 1.3), 0, Math.PI * 2); g.fill();
          }
          var nBand = Math.round((W * H) / 3800);
          for (var j = 0; j < nBand; j++) {
            var tt = Math.random();
            var bx2 = tt * W * 1.15 - W * 0.075;
            var by2 = tt * H * 0.9 + H * 0.02 + (Math.random() + Math.random() + Math.random() - 1.5) * H * 0.16;
            g.fillStyle = 'rgba(205,216,255,' + rnd(0.05, 0.26).toFixed(2) + ')';
            g.beginPath(); g.arc(bx2, by2, rnd(0.4, 1.6), 0, Math.PI * 2); g.fill();
          }
        }

        function build() {
          var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          W = window.innerWidth; H = window.innerHeight;
          canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
          canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildGalaxy();
          stars = [];
          var n = Math.round((W * H) / 14000);
          for (var i = 0; i < n; i++) {
            stars.push({ x: Math.random() * W, y: Math.random() * H, r: rnd(0.6, 1.8), a: rnd(0.4, 1), sp: rnd(0.4, 1.4), ph: rnd(0, Math.PI * 2), gold: Math.random() < 0.12 });
          }
        }
        /* 星空每 80ms 才重画一帧：只贴一张预渲染的星系图 + 少量闪烁星，不会跟翻图抢主线程。 */
        var lastStarDraw = 0;
        function draw(now) {
          if (document.hidden) return;
          /* 翻图时暂停星空重画：把主线程让给翻图，翻完 700ms 内不抢。 */
          if (Date.now() < (window.__cfBusyUntil || 0)) { if (!reduced) requestAnimationFrame(draw); return; }
          if (!reduced && now - lastStarDraw < 80) { requestAnimationFrame(draw); return; }
          lastStarDraw = now;
          ctx.clearRect(0, 0, W, H);
          if (galaxy) ctx.drawImage(galaxy, 0, 0, W, H);
          var i, s;
          for (i = 0; i < stars.length; i++) {
            s = stars[i];
            var a = s.a;
            if (!reduced) a = s.a * (0.55 + 0.45 * Math.sin(now / 1000 * s.sp + s.ph));
            ctx.globalAlpha = a;
            ctx.fillStyle = s.gold ? '#f2d488' : '#ffffff';
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = 1;
          if (!reduced) requestAnimationFrame(draw);
        }
        build();
        if (reduced) draw(0); else requestAnimationFrame(draw);
        var rT = null;
        window.addEventListener('resize', function () {
          if (rT) clearTimeout(rT);
          rT = setTimeout(function () { build(); if (reduced) draw(0); }, 200);
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden && !reduced) requestAnimationFrame(draw);
        });
      })();
    </script>
  </body>
</html>
